name: Build BossPo Play Store AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source BossPo
        uses: actions/checkout@v4

      - name: Ekstrak project Android
        run: |
          rm -rf android-src
          mkdir -p android-src
          unzip -q BossPo_Source_GitHub_FRESH.zip -d android-src
          test -f android-src/github_source/app/build.gradle

      - name: Perbaiki BossPoFileProvider
        run: |
          sed -i 's/requireContext()/requireProviderContext()/g' android-src/github_source/app/src/main/java/com/bosspo/juraganpo/BossPoFileProvider.java

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Cek signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.BOSSPO_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BOSSPO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOSSPO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BOSSPO_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "Semua signing secret tersedia"
⁷
      - name: Buat signing key
        env:
          KEYSTORE_B64: ${{ secrets.BOSSPO_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/bosspo-upload-key.jks"
          test -s "$GITHUB_WORKSPACE/bosspo-upload-key.jks"

      - name: Cek keystore dan alias
        env:
          STORE_PASSWORD: ${{ secrets.BOSSPO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOSSPO_KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/bosspo-upload-key.jks" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build AAB release
        working-directory: android-src/github_source
        run: gradle --no-daemon :app:bundleRelease

      - name: Tandatangani AAB
        env:
          STORE_PASSWORD: ${{ secrets.BOSSPO_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOSSPO_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BOSSPO_KEY_PASSWORD }}
        working-directory: android-src/github_source
        run: |
          cp app/build/outputs/bundle/release/app-release.aab \
             app/build/outputs/bundle/release/BossPo-PlayStore-Release.aab

          jarsigner \
            -keystore "$GITHUB_WORKSPACE/bosspo-upload-key.jks" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            app/build/outputs/bundle/release/BossPo-PlayStore-Release.aab \
            "$KEY_ALIAS"

      - name: Verifikasi AAB final
        working-directory: android-src/github_source
        run: |
          jarsigner -verify -certs \
            app/build/outputs/bundle/release/BossPo-PlayStore-Release.aab
          ls -lh app/build/outputs/bundle/release/BossPo-PlayStore-Release.aab

      - name: Simpan AAB final
        uses: actions/upload-artifact@v4
        with:
          name: BossPo-PlayStore-Final-AAB
          path: android-src/github_source/app/build/outputs/bundle/release/BossPo-PlayStore-Release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Hapus signing key dari runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/bosspo-upload-key.jks"
