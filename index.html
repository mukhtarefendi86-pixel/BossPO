<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BossPO - Catatan PO & Piutang</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-blue-600">BossPO Dashboard</h1>
      <span class="text-sm text-gray-500">bosspo.web.app</span>
    </div>
    
    <div class="bg-white p-6 rounded-lg shadow mb-6">
      <h2 class="text-xl font-semibold mb-4">Input PO Baru</h2>
      <input id="nama" placeholder="Nama Pelanggan" class="w-full p-3 border rounded mb-3">
      <input id="barang" placeholder="Nama Barang / PO" class="w-full p-3 border rounded mb-3">
      <input id="total" type="number" placeholder="Total Harga" class="w-full p-3 border rounded mb-3">
      <select id="status" class="w-full p-3 border rounded mb-3">
        <option>Belum Lunas</option>
        <option>Lunas</option>
        <option>DP</option>
      </select>
      <button onclick="tambahPO()" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded w-full font-semibold">+ Simpan PO</button>
    </div>

    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-xl font-semibold mb-4">Daftar Piutang & PO</h2>
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead><tr class="bg-gray-200">
            <th class="p-3 text-left">Tanggal</th>
            <th class="p-3 text-left">Nama</th>
            <th class="p-3 text-left">Barang</th>
            <th class="p-3 text-right">Total</th>
            <th class="p-3 text-center">Status</th>
          </tr></thead>
          <tbody id="tabelPO"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
